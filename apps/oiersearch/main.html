<!DOCTYPE html>
<html>

<head>
	<title>OIer searcher</title>
	<meta charset="UTF-8">
	<style>
		a {
			text-decoration: none;
			color: #999;
		}

		td,
		th {
			text-align: center;
			height: 30px;
			border-bottom: #444 solid 1px;
		}

		;
	</style>
</head>

<body style="background-color: #222; color: #FFF">
	<div style="margin: 0 auto; max-width: 1200px;">
		<header
			style="display: flex; height: 70px; border-bottom: 5px solid #444; border-left: 3px solid #444; border-right: 3px solid #444;">
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; flex-grow: 1; border-right: 3px solid #444; color: #FFF;"
				href="/">
				首页</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; flex-grow: 1; border-right: 3px solid #444; color: #FFF;"
				href="/aboutme.html">
				关于我</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; flex-grow: 1; border-right: 3px solid #444; color: #FFF;"
				href="/development.html">
				开发</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; flex-grow: 1; border-right: 3px solid #444; color: #FFF;"
				href="/webapplications.html">
				Web 应用</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; flex-grow: 1; color: #FFF;"
				href="/records">
				记录</a>
		</header>
		<main style="margin-top: 50px; width: 100%;">
			<div style="margin: 0 auto; width: max-content;">
				<strong style="font-size: x-large;">OIer searcher</strong>
			</div>
			<p>OIer searcher 可以帮助你通过 OIer 所参与的比赛名、成绩、所获奖项这些信息寻找最匹配的 OIer。</p>
			<p>你可以在搜索框内输入比赛名，然后在下面的列表中选择比赛以添加到你的信息列表中，点击“生成”即可生成搜索代码，然后将其复制进 OIer DB 的自定义搜索框即可。</p>
			<div style="max-width: 600px; margin: 0 auto;">
				<table id="contest-list" style="border: 2px solid #ccc; width: 100%; border-collapse: collapse;">
				</table>
				<br />
				<div style="font-size: small;">点击“不限”可以设置分数或奖项的限制。</div>
				<br />
				搜索比赛以添加到列表中：<input type="text" id="contest-input" onkeyup="searchContest()" placeholder="比赛名称" />
				<ul id="search-result"></ul>
				<br />
				<button onclick="generate()"
					style="width: calc(50% - 2px); height: 40px; background-color: rgb(107, 201, 0);">生成</button>
				<button onclick="copyCode()"
					style="width: calc(50% - 2px); height: 40px; background-color: rgb(233, 233, 96);">复制代码</button>
				<br />
				<button onclick="openOierDB()"
					style="width: 100%; height: 40px; margin-top: 5px; background-color: rgb(0, 165, 206);">打开OIerDB</button>
				<br />
				<br />
				<textarea id="code" spellcheck="false"
					style="display: none; width: 100%; background-color: #222; color: #FFF; height: 400px;">
				</textarea>
			</div>
			<div id="error-list"></div>
		</main>
	</div>
	<script src="/apps/oiersearch/main.js">
	</script>
</body>

</html>
