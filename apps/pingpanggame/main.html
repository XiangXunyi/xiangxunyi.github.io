<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ping Pong</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100vh;background:#050505}.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)}.hide{display:none!important}.card{width:min(540px,88vw);padding:32px;border:1px solid #333;border-radius:24px;background:#0d0d0d;text-align:center;box-shadow:0 30px 80px #000}h1{margin:0 0 12px;font-size:42px;letter-spacing:4px}.sub,.hint{opacity:.62;line-height:1.7}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.btn{border:1px solid #444;border-radius:999px;padding:13px 16px;background:#eee;color:#050505;font-weight:800;cursor:pointer}.btn.gray{background:#151515;color:#eee}.btn.full{width:100%;margin-top:10px}.hud{position:fixed;left:0;right:0;top:0;z-index:3;padding:18px 22px;display:flex;justify-content:space-between;pointer-events:none}.score{font-size:40px;font-weight:900}.info{font-size:13px;opacity:.68;line-height:1.7}.pause{pointer-events:auto;border:1px solid #333;background:#0d0d0d;color:#eee;border-radius:999px;padding:9px 14px;cursor:pointer}.toast{position:fixed;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);font-size:50px;font-weight:900;opacity:0;pointer-events:none}.toast.show{opacity:1}.tag{border:1px solid #333;border-radius:999px;padding:3px 9px;background:#111}#err{position:fixed;left:16px;bottom:16px;z-index:99;display:none;border:1px solid #555;border-radius:12px;background:#111;padding:10px;font-size:13px}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud"><div><div class="score"><span id="ps">0</span> : <span id="as">0</span></div><div class="info">模式：<span id="mode">快速比赛</span><br>难度：<span id="diff">普通</span> <span class="tag" id="serve">左键发球</span><br>弧度：<span id="curve">0</span> <span id="cmode"></span></div></div><button id="pauseBtn" class="pause">暂停 Esc</button></div>
<div id="toast" class="toast"></div><div id="err"></div>
<div id="menu" class="panel"><div class="card"><h1>PING PONG</h1><p class="sub">重构版：真人发球那一下强制白拍；AI 正常回合随机黑白拍。黑拍会先侧出再快速回正，AI 黑拍会有前压动作。</p><div class="row"><button class="btn diff" data-d="easy">简单</button><button class="btn diff" data-d="normal">普通</button><button class="btn diff" data-d="hard">困难</button></div><button id="prac" class="btn gray full">练习模式</button><p class="hint">鼠标控制球拍，左键发球；A/D 左右，W/S 前后。球速只由迎球方向的纵向挥拍速度决定；按住左键使用黑拍，发球那一下除外。</p></div></div>
<div id="pausePanel" class="panel hide"><div class="card"><h1>PAUSE</h1><button id="resume" class="btn full">继续</button><button id="restart" class="btn gray full">重新开始</button><button id="back" class="btn gray full">返回主菜单</button></div></div>
<div id="over" class="panel hide"><div class="card"><h1 id="ot">WIN</h1><p id="otx" class="sub"></p><button id="again" class="btn full">再来一局</button><button id="oback" class="btn gray full">返回主菜单</button></div></div>
<script>
(function(){'use strict';
var c=document.getElementById('game');
var g=c.getContext('2d');
var E={},ids=['ps','as','mode','diff','serve','curve','cmode','toast','menu','pausePanel','over','ot','otx','err'];
for(var i=0;i<ids.length;i++)E[ids[i]]=document.getElementById(ids[i]);
window.onerror=function(msg,src,line,col){E.err.style.display='block';E.err.textContent='脚本错误：'+msg+' @ '+line+':'+col;return false;};
var W=0,H=0,D=1,last=0,state='menu',mode='match',dif='normal';
var key={},mx=null,my=null,mouseDown=false,table,p,ai,b,score,serveSide='player';
var rally=0,best=0,maxv=0,serveT=0,think=0,tx=0,ty=0,toastT=0,aiBlackFlash=0;
var plan={r:-1,off:0,hardShot:false,useBlack:false};
var cfg={
 easy:{n:'简单',xs:500,ys:230,rt:.18,err:82,off:.12,miss:.08,predict:false,black:.16},
 normal:{n:'普通',xs:760,ys:350,rt:.08,err:30,off:.22,miss:.025,predict:false,black:.28},
 hard:{n:'困难',xs:944,ys:488,rt:.035,err:8,off:.30,miss:.006,predict:true,black:.30}
};
var SIDE_ARC=86,HOOK_OUT=28,HOOK_BACK=250,HOOK_TIME=.13,BASE_SPEED=330,MIN_SPEED=280,MAX_SPEED=1080,BLACK_SPEED_MUL=1.5,SERVE_MAX_SPEED=620,BLACK_AI_BOOST=1.22;
function cl(x,l,r){return Math.max(l,Math.min(r,x));}
function dist(x,y){return Math.hypot(x,y);}
function zones(){return{pt:table.cy+table.h*.16,pb:table.y+table.h-42,at:table.y+42,ab:table.cy-table.h*.16};}
function resize(){D=Math.max(1,Math.min(2,window.devicePixelRatio||1));W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);reset(false);}
function reset(newBall){var tw=Math.min(W*.72,780),th=Math.min(H*.78,820),cx=W/2,cy=H/2,pw=Math.max(92,tw*.17),ph=16,zz;table={x:cx-tw/2,y:cy-th/2,w:tw,h:th,cx:cx,cy:cy};if(!p)p={x:cx,y:table.y+table.h-64,w:pw,h:ph,vx:0,vy:0,lx:cx,ly:table.y+table.h-64};else{zz=zones();p.w=pw;p.h=ph;p.x=cl(p.x,table.x+pw/2,table.x+table.w-pw/2);p.y=cl(p.y,zz.pt,zz.pb);}if(!ai)ai={x:cx,y:table.y+64,w:pw,h:ph,vx:0,vy:0,lx:cx,ly:table.y+64};else{zz=zones();ai.w=pw;ai.h=ph;ai.x=cl(ai.x,table.x+pw/2,table.x+table.w-pw/2);ai.y=cl(ai.y,zz.at,zz.ab);}if(newBall||!b)b={x:cx,y:p.y-30,px:cx,py:p.y-30,r:8.5,vx:0,vy:0,curve:0,black:false,hookDir:0,hookPower:0,hookT:0,a:0,hold:true,tr:[],mark:null};}
function hud(){E.ps.textContent=score?score.p:0;E.as.textContent=score?score.a:0;E.diff.textContent=cfg[dif].n;E.mode.textContent=mode==='practice'?'练习模式':'快速比赛';E.serve.textContent=state==='serve'?(serveSide==='player'?'左键发球':'AI 发球中'):(state==='play'?'对打中':'暂停');E.curve.textContent=b?b.curve.toFixed(1):'0';E.cmode.textContent=b&&b.black?'黑拍回正':'普通';}
function say(s){E.toast.textContent=s;E.toast.classList.add('show');toastT=.55;}
function start(d,m){dif=d;mode=m||'match';state='serve';E.menu.classList.add('hide');E.pausePanel.classList.add('hide');E.over.classList.add('hide');score={p:0,a:0};serveSide='player';rally=0;best=0;maxv=0;serveT=0;think=0;plan={r:-1,off:0,hardShot:false,useBlack:false};reset(true);hud();say('开始');}
function forwardSpeed(r,side){var n=side==='player'?-1:1;return Math.max(0,r.vy*n);}
function strokeSpeed(r,side){return cl(BASE_SPEED+forwardSpeed(r,side)*.62,MIN_SPEED,MAX_SPEED);}
function setCurveFromPaddle(r,side,opt){opt=opt||{};var raw=cl(r.vx/80,-12,12);b.curve=raw;b.hookT=0;if(opt.forceWhite)b.black=false;else if(side==='player')b.black=mouseDown;else b.black=!!plan.useBlack;if(b.black){b.hookDir=raw===0?(r.x<table.cx?1:-1):Math.sign(raw);b.hookPower=Math.max(2,Math.abs(raw));}else{b.hookDir=0;b.hookPower=0;}}
function launch(side){var r=side==='player'?p:ai;var n=side==='player'?-1:1;b.hold=false;setCurveFromPaddle(r,side,{forceWhite:side==='player'});var sp=cl(strokeSpeed(r,side),MIN_SPEED,SERVE_MAX_SPEED);b.vx=0;b.vy=n*sp;b.mark=null;state='play';hud();say('SERVE');}
function serveTo(s){serveSide=s;state='serve';serveT=0;b.hold=true;b.tr=[];b.vx=0;b.vy=0;b.curve=0;b.black=false;b.hookDir=0;b.hookPower=0;b.hookT=0;var r=s==='player'?p:ai;b.x=r.x;b.y=s==='player'?r.y-30:r.y+30;b.px=b.x;b.py=b.y;hud();}
function point(who){best=Math.max(best,rally);rally=0;if(mode==='practice'){serveTo('player');say(who==='player'?'GOOD':'MISS');return;}if(who==='player')score.p++;else score.a++;if((score.p>=11||score.a>=11)&&Math.abs(score.p-score.a)>=2){state='over';E.over.classList.remove('hide');E.ot.textContent=score.p>score.a?'WIN':'LOSE';E.otx.textContent='最终比分 '+score.p+' : '+score.a+'，最长回合 '+best+' 拍，最高球速 '+Math.round(maxv);hud();return;}serveTo(who);say(who==='player'?'你得分':'AI 得分');}
function updPlayer(dt){var ox=p.x,oy=p.y,zz=zones();if(mx!==null){p.x=cl(mx,table.x+p.w/2,table.x+table.w-p.w/2);p.y=cl(my,zz.pt,zz.pb);}var dx=0,dy=0;if(key.a||key.A||key.ArrowLeft)dx--;if(key.d||key.D||key.ArrowRight)dx++;if(key.w||key.W||key.ArrowUp)dy--;if(key.s||key.S||key.ArrowDown)dy++;p.x=cl(p.x+dx*980*dt,table.x+p.w/2,table.x+table.w-p.w/2);p.y=cl(p.y+dy*680*dt,zz.pt,zz.pb);p.vx=cl((p.x-ox)/Math.max(dt,.001),-1800,1800);p.vy=cl((p.y-oy)/Math.max(dt,.001),-1400,1400);p.lx=ox;p.ly=oy;}
function stepVirtual(o,dt){if(!o.black){o.vx+=o.curve*SIDE_ARC*dt;}else{o.hookT+=dt;if(o.hookT<HOOK_TIME)o.vx+=o.hookDir*o.hookPower*70*dt;else{o.vx-=o.hookDir*o.hookPower*HOOK_BACK*dt;o.vx*=Math.pow(.94,dt*60);}}o.x+=o.vx*dt;o.y+=o.vy*dt;o.curve*=Math.pow(.998,dt*60);if(o.x-b.r<table.x){o.x=table.x+b.r;o.vx=Math.abs(o.vx);o.curve=-o.curve*.92;o.hookDir=-o.hookDir;}if(o.x+b.r>table.x+table.w){o.x=table.x+table.w-b.r;o.vx=-Math.abs(o.vx);o.curve=-o.curve*.92;o.hookDir=-o.hookDir;}return o;}
function applyCurve(dt){var o=stepVirtual({x:b.x,y:b.y,vx:b.vx,vy:b.vy,curve:b.curve,black:b.black,hookDir:b.hookDir,hookPower:b.hookPower,hookT:b.hookT},dt);b.x=o.x;b.y=o.y;b.vx=o.vx;b.vy=o.vy;b.curve=o.curve;b.hookDir=o.hookDir;b.hookT=o.hookT;}
function predict(targetY){var o={x:b.x,y:b.y,vx:b.vx,vy:b.vy,curve:b.curve,black:b.black,hookDir:b.hookDir,hookPower:b.hookPower,hookT:b.hookT};var st=.012;for(var t=0;t<2.5;t+=st){o=stepVirtual(o,st);if((targetY-o.y)*o.vy<=0)return o.x;}return o.x;}
function choosePlan(){var C=cfg[dif],side;if(b.x<table.cx-table.w*.18)side=1;else if(b.x>table.cx+table.w*.18)side=-1;else side=(rally%2)?-1:1;if(dif==='easy'&&Math.random()<.35)side=-side;if(dif==='normal'&&Math.random()<.12)side=-side;plan.r=rally;plan.off=side*C.off;plan.hardShot=false;plan.useBlack=Math.random()<C.black;}
function updAI(dt){var C=cfg[dif],ox=ai.x,oy=ai.y,zz=zones();var prep=zz.at+(zz.ab-zz.at)*.16;var incoming=b.vy<0;if(!incoming){tx=table.cx;ty=prep;think=0;plan.r=-1;plan.useBlack=false;}else{think-=dt;if(think<=0){if(plan.r!==rally)choosePlan();var px=C.predict?predict(ai.y):b.x;var close=cl((ai.y-b.y)/(ai.y-table.y),0,1);var easy=Math.abs(px-ai.x)<ai.w*.55&&Math.abs(ai.y-b.y)>table.h*.12;plan.hardShot=dif==='hard'&&easy;var shotOff=plan.hardShot?plan.off*1.75:plan.off;tx=px-shotOff*ai.w*.24*close+(Math.random()*2-1)*C.err;var strikeBase=dif==='hard'?.70:.56;var blackPress=plan.useBlack?.18:0;var hardPress=plan.hardShot?.12:0;var strike=zz.at+(zz.ab-zz.at)*cl(strikeBase+blackPress+hardPress,.45,.94);var k=cl((table.cy-b.y)/(table.cy-ai.y),0,1);ty=prep+(strike-prep)*k;think=C.rt;}}ai.x=cl(ai.x+cl(tx-ai.x,-C.xs*dt,C.xs*dt),table.x+ai.w/2,table.x+table.w-ai.w/2);ai.y=cl(ai.y+cl(ty-ai.y,-C.ys*dt,C.ys*dt),zz.at,zz.ab);ai.vx=cl((ai.x-ox)/Math.max(dt,.001),-1600,1600);ai.vy=cl((ai.y-oy)/Math.max(dt,.001),-1200,1200);ai.lx=ox;ai.ly=oy;}
function hitRect(r){return b.x+b.r>r.x-r.w/2&&b.x-b.r<r.x+r.w/2&&b.y+b.r>r.y-r.h/2&&b.y-b.r<r.y+r.h/2;}
function sweep(r,side){if(hitRect(r))return true;var playerSide=side==='player';var face0=r.ly+(playerSide?-r.h/2:r.h/2);var face1=r.y+(playerSide?-r.h/2:r.h/2);var b0=b.py+(playerSide?b.r:-b.r);var b1=b.y+(playerSide?b.r:-b.r);var d0=b0-face0,d1=b1-face1;var crossed=playerSide?(d0<=4&&d1>=-8):(d0>=-4&&d1<=8);if(!crossed)return false;var den=d0-d1;var t=den===0?.5:cl(d0/den,0,1);var bx=b.px+(b.x-b.px)*t;var rx=r.lx+(r.x-r.lx)*t;return Math.abs(bx-rx)<=r.w/2+b.r+4;}
function hit(r,side){var n=side==='player'?-1:1;if((b.vy-r.vy)*n>120)return;var C=cfg[dif];if(side==='ai'&&Math.random()<C.miss&&Math.abs(b.x-r.x)>r.w*.16)return;var oldRatio=cl(b.vx/Math.max(260,Math.abs(b.vy)),-.72,.72);setCurveFromPaddle(r,side);var sp=strokeSpeed(r,side);if(side==='player'&&b.black)sp=cl(sp*BLACK_SPEED_MUL,MIN_SPEED,MAX_SPEED*BLACK_SPEED_MUL);if(side==='ai'&&b.black)sp=cl(sp*BLACK_AI_BOOST+90,MIN_SPEED,MAX_SPEED*1.15);if(side==='ai'&&dif==='hard'&&plan.hardShot)sp=cl(sp*1.18,MIN_SPEED,MAX_SPEED*1.15);var inv=1/Math.sqrt(1+oldRatio*oldRatio);b.vx=oldRatio*sp*inv;b.vy=n*sp*inv;if(side==='ai'&&dif==='hard'&&plan.hardShot){b.curve=cl(b.curve+(plan.off>0?6.5:-6.5),-12,12);}if(b.black)b.vx+=b.hookDir*b.hookPower*HOOK_OUT;b.y=side==='player'?r.y-r.h/2-b.r-1:r.y+r.h/2+b.r+1;if(side==='ai'&&b.black)aiBlackFlash=.22;rally++;maxv=Math.max(maxv,dist(b.vx,b.vy));hud();}
function updBall(dt){if(b.hold){var r=serveSide==='player'?p:ai;b.x=r.x;b.y=serveSide==='player'?r.y-30:r.y+30;b.px=b.x;b.py=b.y;if(serveSide==='ai'){serveT+=dt;if(serveT>.55)launch('ai');}return;}b.px=b.x;b.py=b.y;applyCurve(dt);b.a+=dist(b.vx,b.vy)*dt*.035;if(b.mark)b.mark.t-=dt;b.tr.push({x:b.x,y:b.y});if(b.tr.length>44)b.tr.shift();if(b.x-b.r<table.x){b.x=table.x+b.r;b.vx=Math.abs(b.vx);b.curve=-b.curve*.92;b.hookDir=-b.hookDir;b.mark={x:b.x,y:b.y,t:.22,m:'镜面反弹'};}if(b.x+b.r>table.x+table.w){b.x=table.x+table.w-b.r;b.vx=-Math.abs(b.vx);b.curve=-b.curve*.92;b.hookDir=-b.hookDir;b.mark={x:b.x,y:b.y,t:.22,m:'镜面反弹'};}if(sweep(p,'player'))hit(p,'player');if(sweep(ai,'ai'))hit(ai,'ai');if(b.y>table.y+table.h+70)point('ai');if(b.y<table.y-70)point('player');}
function rr(x,y,w,h,r,fill){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);if(fill)g.fill();else g.stroke();}
function drawPad(r,fill,stroke){g.save();g.translate(r.x,r.y);g.fillStyle=fill;rr(-r.w/2,-r.h/2,r.w,r.h,8,1);g.strokeStyle=stroke;g.lineWidth=2;rr(-r.w/2,-r.h/2,r.w,r.h,8,0);g.restore();}
function drawBall(){for(var i=1;i<b.tr.length;i++){var a=i/b.tr.length*.58;g.strokeStyle='rgba(255,255,255,'+a+')';g.lineWidth=1.5+i/b.tr.length*5.4;g.beginPath();g.moveTo(b.tr[i-1].x,b.tr[i-1].y);g.lineTo(b.tr[i].x,b.tr[i].y);g.stroke();}var m=Math.abs(b.curve);if(m>.35){var al=Math.min(.95,.30+m*.07);g.strokeStyle=b.black?'rgba(80,80,80,'+al+')':'rgba(255,255,255,'+al+')';g.lineWidth=3;g.setLineDash([10,5]);g.beginPath();g.arc(b.x,b.y,b.r+12+m*2.2,b.a,b.a+Math.PI*1.55*(b.curve>=0?1:-1),b.curve<0);g.stroke();g.setLineDash([]);g.strokeStyle=b.black?'rgba(30,30,30,.9)':'rgba(255,255,255,.76)';g.lineWidth=2;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x+(b.black?b.hookDir*m*6:b.curve*6),b.y);g.stroke();}g.save();g.translate(b.x,b.y);g.rotate(b.a);g.fillStyle='#f5f5f5';g.beginPath();g.arc(0,0,b.r,0,Math.PI*2);g.fill();g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.moveTo(-b.r*.75,0);g.lineTo(b.r*.75,0);g.stroke();g.restore();if(b.mark&&b.mark.t>0){g.fillStyle='rgba(255,255,255,'+Math.min(1,b.mark.t*4)+')';g.font='700 13px system-ui';g.textAlign='center';g.fillText(b.mark.m,b.mark.x+(b.mark.x<table.cx?46:-46),b.mark.y-16);}}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#101010';rr(table.x,table.y,table.w,table.h,22,1);g.strokeStyle='#666';g.lineWidth=2;rr(table.x+8,table.y+8,table.w-16,table.h-16,16,0);g.strokeStyle='#eee';g.lineWidth=4;g.beginPath();g.moveTo(table.x,table.cy);g.lineTo(table.x+table.w,table.cy);g.stroke();g.fillStyle='#050505';g.fillRect(table.x,table.cy-3,table.w,6);var zz=zones();g.fillStyle='rgba(255,255,255,.025)';g.fillRect(table.x,zz.pt,table.w,zz.pb-zz.pt);g.fillRect(table.x,zz.at,table.w,zz.ab-zz.at);if(aiBlackFlash>0)aiBlackFlash-=1/60;drawPad(ai,(plan.useBlack||aiBlackFlash>0)&&state==='play'?'#050505':'#888',(plan.useBlack||aiBlackFlash>0)&&state==='play'?'#eee':'#ddd');drawPad(p,mouseDown&&state!=='serve'?'#050505':'#eee',mouseDown&&state!=='serve'?'#eee':'#777');drawBall();g.fillStyle='rgba(255,255,255,.045)';g.font='900 128px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(score?score.p:0,table.x+table.w*.23,table.cy);g.fillText(score?score.a:0,table.x+table.w*.77,table.cy);if(state==='serve'){g.fillStyle='rgba(255,255,255,.72)';g.font='800 18px system-ui';g.fillText(serveSide==='player'?'LEFT CLICK TO SERVE':'AI SERVING',table.cx,table.cy+35);}}
function loop(t){var dt=Math.min(.033,(t-last)/1000||.016);last=t;if(state==='play'||state==='serve'){updPlayer(dt);updAI(dt);updBall(dt);}if(toastT>0){toastT-=dt;if(toastT<=0)E.toast.classList.remove('show');}draw();requestAnimationFrame(loop);}
function pause(){if(state==='play'||state==='serve'){state='pause';E.pausePanel.classList.remove('hide');hud();}}
function resume(){if(state==='pause'){state=b.hold?'serve':'play';E.pausePanel.classList.add('hide');hud();}}
function bind(){var a=document.querySelectorAll('.diff');for(var i=0;i<a.length;i++)a[i].onclick=function(){start(this.getAttribute('data-d'),'match');};document.getElementById('prac').onclick=function(){start('normal','practice');};document.getElementById('pauseBtn').onclick=pause;document.getElementById('resume').onclick=resume;document.getElementById('restart').onclick=function(){start(dif,mode);};document.getElementById('back').onclick=function(){state='menu';E.pausePanel.classList.add('hide');E.menu.classList.remove('hide');};document.getElementById('again').onclick=function(){start(dif,mode);};document.getElementById('oback').onclick=function(){state='menu';E.over.classList.add('hide');E.menu.classList.remove('hide');};}
window.onkeydown=function(e){key[e.key]=1;if(e.key===' '){e.preventDefault();if(state==='serve'&&serveSide==='player')launch('player');}if(e.key==='Escape'){if(state==='pause')resume();else pause();}};
window.onkeyup=function(e){key[e.key]=0;};
c.onmousemove=function(e){mx=e.clientX;my=e.clientY;};
