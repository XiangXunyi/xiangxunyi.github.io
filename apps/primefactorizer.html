<!DOCTYPE html>
<html>

<head>
	<title>Prime factorizer</title>
	<meta charset="UTF-8">
	<script>
		function pow(b, e, m)
		{
			let res = 1n;
			while (e != 0)
			{
				if (e & 1n)
				{
					res *= b;
					res %= m;
				}
				b = b * b % m;
				e >>= 1n;
			}
			return res;
		}
		function bigrandom(n)
		{
			let tmp = n, cnt = 0;
			while (tmp != 0n)
			{
				++cnt;
				tmp >>= 4n;
			}
			let res = 0n;
			while (cnt-- != 0)
			{
				res <<= 4n;
				res += BigInt(Math.floor(Math.random() * 16));
			}
			res %= n;
			return res;
		}
		function isPrime(n)
		{
			if (n <= 100n)
			{
				for (let i = 2n; i <= 10n; ++i)
					if (n % i == 0n && n != i)
						return false;
				return true;
			}
			if (n % 2n == 0n || n % 3n == 0n)
				return false;
			let u = n - 1n, t = 0;
			while ((u & 1n) != 0n)
			{
				u >>= 1n;
				++t;
			}
			let test_cast = 16;
			while (test_cast != 0)
			{
				--test_cast;
				let a = bigrandom(n - 3n) + 2n;
				let v = pow(a, u, n);
				if (v == 1)
					continue;
				let flag = false;
				for (let i = 0; i < t; ++i)
				{
					if (v == -1n)
					{
						flag = true;
						break;
					}
					v = v * v % n;
				}
				if (!flag)
					return false;
			}
			return true;
		}
		function gcd(x, y) { return y == 0n ? x : gcd(y, x % y); }
		function builtinfactorize(n)
		{
			if (n == 4n)
				return [2n, 2n];
			if (isPrime(n))
				return [n];
			while (true)
			{
				let c = bigrandom(n) + 1n;
				++c;
				let single = c, double = (c * c + c) % n;
				while (single != double)
				{
					let g = gcd(single < double ? double - single : single - double, n);
					if (g != 1n)
						if (g == n)
							break;
						else
							return [...builtinfactorize(g), ...builtinfactorize(n / g)];
					single = (single * single + c) % n;
					double = (double * double + c) % n;
					double = (double * double + c) % n;
				}
			}
		}
		async function factorize(n)
		{
			if (n == 1n)
				return [1n];
			return builtinfactorize(n).sort((a, b) => (a < b ? -1 : 1));
		}
	</script>
</head>

<body style="background-color: #222; color: #FFF">
	<div style="margin: 0 auto; max-width: 1200px;">
		<header
			style="height: 70px; border-bottom: 5px solid #444; border-left: 3px solid #444; border-right: 3px solid #444;">
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; width: calc(20% - 6px); border-right: 3px solid #444; color: #FFF;"
				href="/">
				首页</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; width: calc(20% - 6px); border-right: 3px solid #444; color: #FFF;"
				href="/aboutme.html">
				关于我</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; width: calc(20% - 6px); border-right: 3px solid #444; color: #FFF;"
				href="/development.html">
				开发</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; width: calc(20% - 6px); border-right: 3px solid #444; color: #FFF;"
				href="/webapplications.html">
				Web 应用</a>
			<a style="display: inline-flex; align-items: center; justify-content: center; height: 100%; width: calc(20% - 6px); color: #FFF;"
				href="/records">
				记录</a>
		</header>
		<main style="margin-top: 50px; width: 100%;">
			<div style="margin: 0 auto; width: max-content;">
				<strong style="font-size: x-large;">Prime factorizer</strong>
			</div>
			<div style="max-width: 300px; margin: 0 auto; text-align: center;">
				<p>Prime factorizer 是一个质因数分解器。</p>
				<br />
				输入一个数字：
				<br />
				<br />
				<input type="number" id="number-input" placeholder="数字" style="width: 100%; font-size: large;" />
				<br />
				<br />
				<button onclick="newtask()" style="width: calc(50% - 2px); height: 40px; background-color: rgb(107, 201, 0);">分解</button>
				<br />
				<br />
			</div>
			<div id="factorizing-list"></div>
			<div id="error-list"></div>
			<script>
				function removeError()
				{
					let list = document.getElementById("error-list");
					list.removeChild(list.firstElementChild);
				}

				function showError(msg, color)
				{
					let list = document.getElementById("error-list");
					let p = document.createElement("p");
					p.innerHTML = msg;
					p.style.color = color;
					list.appendChild(p);
					setTimeout(removeError, 3000);
				}

				let cnt = 0;
				function newtask()
				{
					let n;
					try
					{
						n = BigInt(document.getElementById("number-input").value);
						if (n <= 0n)
							throw(null);
					}
					catch (err)
					{
						showError("请输入正整数", "red");
						return;
					}
					++cnt;
					let list = document.getElementById("factorizing-list");
					let p = document.createElement("p");
					p.innerHTML = `${n}: 正在分解中`;
					list.appendChild(p);
					factorize(n).then((result) => 
					{
						let string = "", last = 0n, cnt = 0;
						for (let i = 0; i < result.length; ++i)
						{
							let x = result[i];
							if (x == last)
								++cnt;
							else
							{
								if (cnt == 1)
									string += `${last} * `;
								else if (cnt != 0)
									string += `${last}<sup>${cnt}</sup> * `;
								last = x;
								cnt = 1;
							}
						}
						if (cnt == 1)
							string += `${last}`;
						else
							string += `${last}<sup>${cnt}</sup>`;
						p.innerHTML = `${n} = ${string}`;
					});
				}
			</script>
		</main>
	</div>
</body>

</html>
